name: Projects snapshot

# Refreshes data/projects.json (the Projects board reads it before the GitHub API, so
# visitors never hit the API rate limit). Commits only when a repository changed.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the public repositories
        run: node tools/fetch-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the snapshot if it changed
        run: |
          if git diff --quiet -- data/projects.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git commit -m "chore(projects): Refresh the GitHub snapshot"
          git push
